{% extends "base.html" %}
{% block title %}Register - Student Portal{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card">
        <h1>Create an account</h1>
        <p class="subtitle">Join the Student Portal in a few seconds.</p>

        {% if errors %}
            <div class="alert alert-error">
                <ul>
                    {% for e in errors %}
                        <li>{{ e }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form action="/register" method="post">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" value="{{ name }}" placeholder="Your full name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email }}" placeholder="you@example.com">

            <label for="password">Password <span class="hint">(minimum 8 characters)</span></label>
            <input type="password" id="password" name="password" placeholder="Create a password">

            <button type="submit" class="btn btn-block">Register</button>
        </form>

        <p class="form-footer" style="margin-top:1.25rem;">
            Already registered? <a href="/login">Login</a>
        </p>
    </div>
</div>
{% endblock %}
